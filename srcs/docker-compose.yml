services:
  nginx:
    build: ./requirements/nginx
    image: nginx
    pull_policy: build
    container_name: nginx
    volumes:
      - volume_wordpress:/var/www/html
    networks:
      - inception
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    pull_policy: build
    container_name: wordpress
    volumes:
      - volume_wordpress:/var/www/html
    networks:
      - inception
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    pull_policy: build
    container_name: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - volume_mariadb:/var/lib/mysql
    networks:
      - inception

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  volume_wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/henrotel/data/wordpress
  volume_mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/henrotel/data/mariadb
